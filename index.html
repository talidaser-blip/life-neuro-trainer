<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>НейроГерой: Практика молодости</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #e89500; /* Теплый сочный оранжевый фон */
      color: #2b1f14;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .card {
      background: #ffffff;
      max-width: 620px;
      width: 100%;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 14px 35px rgba(180, 100, 0, 0.28);
      border: 3px solid #ffffff;
      box-sizing: border-box;
      margin: 10px auto;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      background: #fff0f3;
      color: #ff3b65;
      border: 1.5px solid #ffccd5;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .audio-btn {
      background: #e8f7f8;
      color: #198c90;
      border: 1.5px solid #38b6ba;
      border-radius: 22px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .audio-btn:hover {
      background: #38b6ba;
      color: #ffffff;
    }

    .audio-btn.speaking {
      background: #ff5b79;
      border-color: #ff3b65;
      color: #ffffff;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    h1 {
      font-size: 22px;
      margin: 8px 0 16px 0;
      color: #2b1f14;
      font-weight: 800;
    }

    /* Навигация переключения блоков */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }

    .nav-btn {
      flex: 1;
      padding: 12px 14px;
      border: 2px solid #38b6ba;
      background: #ffffff;
      color: #198c90;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn:hover:not(:disabled) {
      background: #effafb;
    }

    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      border-color: #d1d5db;
      color: #9ca3af;
    }

    /* Список выражений */
    .phrase-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .phrase-item {
      background: #fffaf4;
      border: 1.5px solid #f6cf8a;
      border-radius: 18px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .phrase-item .num-badge {
      align-self: flex-start;
      font-size: 11px;
      font-weight: 800;
      color: #198c90;
      background: #e8f7f8;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .old-phrase {
      font-size: 13px;
      color: #9d8b7a;
      text-decoration: line-through;
      font-weight: 500;
    }

    .new-phrase {
      font-size: 16px;
      font-weight: 800;
      color: #d66c00;
      line-height: 1.4;
    }

    .footer-note {
      text-align: center;
      font-size: 13px;
      color: #8c7b6d;
      border-top: 2px dashed #f0e6da;
      padding-top: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header-row">
      <span class="badge" id="blockBadge">Уровень 1 • Блок 1</span>
      <!-- Кнопка плеера -->
      <button class="audio-btn" id="audioToggleBtn" onclick="toggleAudio()">
        <span id="audioIcon">🎧</span>
        <span id="audioLabel">Озвучить блок</span>
      </button>
    </div>

    <h1 id="blockTitle">Загрузка...</h1>

    <!-- Верхняя навигация -->
    <div class="nav-bar">
      <button class="nav-btn" id="prevBtn" onclick="prevBlock()">← Назад</button>
      <button class="nav-btn" id="nextBtn" onclick="nextBlock()">Следующий блок →</button>
    </div>

    <!-- Контейнер для всех фраз -->
    <div class="phrase-list" id="phraseList">
      <div style="text-align: center; padding: 20px; color: #8c7b6d;">Загрузка списка фраз...</div>
    </div>

    <!-- Нижняя навигация -->
    <div class="nav-bar">
      <button class="nav-btn" id="prevBtnBottom" onclick="prevBlock()">← Назад</button>
      <button class="nav-btn" id="nextBtnBottom" onclick="nextBlock()">Следующий блок →</button>
    </div>

    <div class="footer-note" id="blockSummary">
      Наденьте наушники, включите аудио и можете убрать телефон в карман.
    </div>
  </div>

  <script>
    // Здесь мы привязываем каждому блоку свой аудиофайл!
    const blocks = [
      { file: "levels/level_1_block_1.txt", audio: "audio/block_1.mp3", badge: "Уровень 1 • Блок 1", title: "Замена слов-разрушителей" },
      { file: "levels/level_1_block_2.txt", audio: "audio/block_2.mp3", badge: "Уровень 1 • Блок 2", title: "Молодость и сияние кожи" },
      { file: "levels/level_1_block_3.txt", audio: "audio/block_3.mp3", badge: "Уровень 1 • Блок 3", title: "Ясность ума и энергия" },
      { file: "levels/level_1_block_4.txt", audio: "audio/block_4.mp3", badge: "Уровень 1 • Блок 4", title: "Золотые афоризмы мудрости" }
    ];

    const fallbackBlock1 = [
      { oldP: "Я древняя", newP: "Я опытная и мудрая" },
      { oldP: "Я совершенно истощена", newP: "Я слегка утомлена, мне нужен хороший отдых" },
      { oldP: "Я слишком стара для этого", newP: "Я выбираю то, что радует меня сегодня" }
    ];

    let currentBlockIdx = 0;
    let currentPhrases = [];
    
    // Переменные для нашего нового аудиоплеера
    let currentAudio = null;
    let isPlaying = false;

    async function loadCurrentBlock() {
      stopAudio(); // Останавливаем звук при переключении блока

      const b = blocks[currentBlockIdx];
      document.getElementById('blockBadge').innerText = b.badge;
      document.getElementById('blockTitle').innerText = b.title;

      document.getElementById('prevBtn').disabled = (currentBlockIdx === 0);
      document.getElementById('prevBtnBottom').disabled = (currentBlockIdx === 0);
      document.getElementById('nextBtn').disabled = (currentBlockIdx === blocks.length - 1);
      document.getElementById('nextBtnBottom').disabled = (currentBlockIdx === blocks.length - 1);

      try {
        const response = await fetch(b.file);
        if (!response.ok) throw new Error("Файл не найден");
        const text = await response.text();
        currentPhrases = text.trim().split("\n").filter(l => l.includes("//")).map(line => {
          const parts = line.split("//");
          return { oldP: parts[0].trim(), newP: parts[1].trim() };
        });
        if (currentPhrases.length === 0) throw new Error("Пустой блок");
      } catch (e) {
        currentPhrases = fallbackBlock1; // если файла нет на github
      }

      renderPhrases();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderPhrases() {
      const container = document.getElementById('phraseList');
      container.innerHTML = "";

      currentPhrases.forEach((p, idx) => {
        const item = document.createElement('div');
        item.className = 'phrase-item';
        item.innerHTML = `
          <div class="num-badge">#${idx + 1}</div>
          <div class="old-phrase">${escapeHtml(p.oldP)}</div>
          <div class="new-phrase">${escapeHtml(p.newP)}</div>
        `;
        container.appendChild(item);
      });
    }

    function prevBlock() {
      if (currentBlockIdx > 0) {
        currentBlockIdx--;
        loadCurrentBlock();
      }
    }

    function nextBlock() {
      if (currentBlockIdx < blocks.length - 1) {
        currentBlockIdx++;
        loadCurrentBlock();
      }
    }

    /* Логика воспроизведения MP3 файла */
    function toggleAudio() {
      if (isPlaying) {
        stopAudio();
      } else {
        playAudio();
      }
    }

    function playAudio() {
      const b = blocks[currentBlockIdx];
      
      // Создаем плеер, если его еще нет или если сменился блок
      if (!currentAudio || currentAudio.src.indexOf(b.audio) === -1) {
        if (currentAudio) currentAudio.pause();
        
        currentAudio = new Audio(b.audio);
        currentAudio.onended = () => stopAudio(); // Когда трек доиграл
        currentAudio.onerror = () => {
          alert("Не удалось загрузить аудио! Проверьте, загрузили ли вы файл " + b.audio + " на GitHub.");
          stopAudio();
        };
      }
      
      currentAudio.play();
      isPlaying = true;
      updateAudioBtn(true);
    }

    function stopAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0; // Сбрасываем в начало
      }
      isPlaying = false;
      updateAudioBtn(false);
    }

    function updateAudioBtn(speaking) {
      const btn = document.getElementById('audioToggleBtn');
      const icon = document.getElementById('audioIcon');
      const label = document.getElementById('audioLabel');

      if (speaking) {
        btn.classList.add('speaking');
        icon.innerText = "⏹️";
        label.innerText = "Остановить";
      } else {
        btn.classList.remove('speaking');
        icon.innerText = "🎧";
        label.innerText = "Озвучить блок";
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    loadCurrentBlock();
  </script>
</body>
</html>
