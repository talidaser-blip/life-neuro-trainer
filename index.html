<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>НейроГерой: Практика молодости</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #e89500;
      color: #2b1f14;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .card {
      background: #ffffff;
      max-width: 620px;
      width: 100%;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 14px 35px rgba(180, 100, 0, 0.28);
      border: 3px solid #ffffff;
      box-sizing: border-box;
      margin: 10px auto;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      background: #fff0f3;
      color: #ff3b65;
      border: 1.5px solid #ffccd5;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .audio-btn {
      background: #e8f7f8;
      color: #198c90;
      border: 1.5px solid #38b6ba;
      border-radius: 22px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .audio-btn:hover {
      background: #38b6ba;
      color: #ffffff;
    }

    .audio-btn.speaking {
      background: #ff5b79;
      border-color: #ff3b65;
      color: #ffffff;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    /* Панель выбора голоса */
    .voice-settings {
      background: #fdf6ec;
      border: 1.5px solid #f6cf8a;
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .voice-settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .voice-settings label {
      font-size: 13px;
      font-weight: 700;
      color: #7c4b00;
    }

    .voice-select {
      flex: 1;
      min-width: 200px;
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid #d6aa65;
      background: #ffffff;
      font-size: 13px;
      color: #2b1f14;
      font-weight: 600;
      outline: none;
    }

    .rate-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #7c4b00;
    }

    .rate-controls input[type="range"] {
      accent-color: #ff5b79;
      cursor: pointer;
    }

    h1 {
      font-size: 22px;
      margin: 4px 0 16px 0;
      color: #2b1f14;
      font-weight: 800;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }

    .nav-btn {
      flex: 1;
      padding: 12px 14px;
      border: 2px solid #38b6ba;
      background: #ffffff;
      color: #198c90;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn:hover:not(:disabled) {
      background: #effafb;
    }

    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      border-color: #d1d5db;
      color: #9ca3af;
    }

    .phrase-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .phrase-item {
      background: #fffaf4;
      border: 1.5px solid #f6cf8a;
      border-radius: 18px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.25s ease;
      position: relative;
    }

    .phrase-item.active-speaking {
      border-color: #ff5b79;
      background: #fff0f3;
      box-shadow: 0 4px 16px rgba(255, 91, 121, 0.25);
    }

    .phrase-item .num-badge {
      align-self: flex-start;
      font-size: 11px;
      font-weight: 800;
      color: #198c90;
      background: #e8f7f8;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .old-phrase {
      font-size: 13px;
      color: #9d8b7a;
      text-decoration: line-through;
      font-weight: 500;
    }

    .new-phrase {
      font-size: 16px;
      font-weight: 800;
      color: #d66c00;
      line-height: 1.4;
    }

    .footer-note {
      text-align: center;
      font-size: 13px;
      color: #8c7b6d;
      border-top: 2px dashed #f0e6da;
      padding-top: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header-row">
      <span class="badge" id="blockBadge">Уровень 1 • Блок 1</span>
      <button class="audio-btn" id="audioToggleBtn" onclick="toggleAudio()">
        <span id="audioIcon">🎧</span>
        <span id="audioLabel">Озвучить блок</span>
      </button>
    </div>

    <!-- Настройки голоса -->
    <div class="voice-settings">
      <div class="voice-settings-row">
        <label for="voiceSelect">🗣 Голос:</label>
        <select id="voiceSelect" class="voice-select" onchange="onVoiceChanged()">
          <option value="">Поиск русских голосов...</option>
        </select>
      </div>
      <div class="voice-settings-row">
        <label>Скорость: <span id="rateVal">0.9x</span></label>
        <div class="rate-controls">
          <span>Медленнее</span>
          <input type="range" id="rateRange" min="0.6" max="1.3" step="0.05" value="0.9" oninput="updateRate()">
          <span>Быстрее</span>
        </div>
      </div>
    </div>

    <h1 id="blockTitle">Загрузка...</h1>

    <div class="nav-bar">
      <button class="nav-btn" id="prevBtn" onclick="prevBlock()">← Назад</button>
      <button class="nav-btn" id="nextBtn" onclick="nextBlock()">Следующий блок →</button>
    </div>

    <div class="phrase-list" id="phraseList">
      <div style="text-align: center; padding: 20px; color: #8c7b6d;">Загрузка списка фраз...</div>
    </div>

    <div class="nav-bar">
      <button class="nav-btn" id="prevBtnBottom" onclick="prevBlock()">← Назад</button>
      <button class="nav-btn" id="nextBtnBottom" onclick="nextBlock()">Следующий блок →</button>
    </div>

    <div class="footer-note" id="blockSummary">
      Выберите удобный голос, наденьте наушники и нажмите «Озвучить блок».
    </div>
  </div>

  <script>
    const blocks = [
      { file: "levels/level_1_block_1.txt", badge: "Уровень 1 • Блок 1", title: "Замена слов-разрушителей" },
      { file: "levels/level_1_block_2.txt", badge: "Уровень 1 • Блок 2", title: "Молодость и сияние кожи" },
      { file: "levels/level_1_block_3.txt", badge: "Уровень 1 • Блок 3", title: "Ясность ума и энергия" },
      { file: "levels/level_1_block_4.txt", badge: "Уровень 1 • Блок 4", title: "Золотые афоризмы мудрости" }
    ];

    const fallbackBlock1 = [
      { oldP: "Я древняя", newP: "Я опытная и мудрая" },
      { oldP: "Я совершенно истощена", newP: "Я слегка утомлена, мне нужен хороший отдых" },
      { oldP: "Я слишком стара для этого", newP: "Я выбираю то, что радует меня сегодня" },
      { oldP: "Все мое тело в ужасных морщинах", newP: "Это едва заметные следы смеха и улыбок" },
      { oldP: "Я выгляжу старо", newP: "Моя кожа слегка обезвожена, я выпью чистой воды" },
      { oldP: "У меня гусиные лапки", newP: "Мои глаза излучают тепло, смех и доброту" },
      { oldP: "Я чувствую себя разбитой", newP: "Моя энергия временно восстанавливается" },
      { oldP: "Моя память как решето", newP: "Моя память острая, я просто держала в голове много дел" },
      { oldP: "Я слишком немощная", newP: "Я внимательна и бережна к своему телу" },
      { oldP: "Я устарела и вышла в тираж", newP: "Я постоянно учусь, обновляюсь и развиваюсь" },
      { oldP: "Мои суставы стареют", newP: "Моим суставам нужна мягкая разминка и растяжка" },
      { oldP: "Я теряю зрение из-за возраста", newP: "Моим глазам просто нужно лучшее освещение и отдых" },
      { oldP: "Я умираю от усталости", newP: "Я с предвкушением жду глубокого восстанавливающего сна" },
      { oldP: "Поезд ушел, уже поздно", newP: "Сейчас идеальное время для нового начала" },
      { oldP: "По утрам я выгляжу ужасно", newP: "Я просыпаюсь отдохнувшей, свежей и обновленной" }
    ];

    let currentBlockIdx = 0;
    let currentPhrases = [];
    let isSpeaking = false;
    let synth = window.speechSynthesis;
    let russianVoices = [];
    let selectedVoice = null;
    let currentSpeechRate = 0.9;

    function populateVoices() {
      if (!('speechSynthesis' in window)) return;
      const allVoices = synth.getVoices();
      russianVoices = allVoices.filter(v => v.lang.toLowerCase().startsWith('ru'));

      const select = document.getElementById('voiceSelect');
      select.innerHTML = '';

      if (russianVoices.length === 0) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.innerText = 'Стандартный голос системы (RU)';
        select.appendChild(opt);
        return;
      }

      const savedVoiceName = localStorage.getItem('preferred_voice_name');

      russianVoices.forEach((voice, i) => {
        const opt = document.createElement('option');
        opt.value = voice.name;
        opt.innerText = `${voice.name} (${voice.lang})`;
        if (savedVoiceName && voice.name === savedVoiceName) {
          opt.selected = true;
          selectedVoice = voice;
        } else if (!savedVoiceName && i === 0) {
          selectedVoice = voice;
        }
        select.appendChild(opt);
      });
    }

    function onVoiceChanged() {
      const select = document.getElementById('voiceSelect');
      selectedVoice = russianVoices.find(v => v.name === select.value) || null;
      if (selectedVoice) {
        localStorage.setItem('preferred_voice_name', selectedVoice.name);
      }
      if (isSpeaking) {
        stopAudio();
      }
    }

    function updateRate() {
      currentSpeechRate = parseFloat(document.getElementById('rateRange').value);
      document.getElementById('rateVal').innerText = currentSpeechRate.toFixed(2) + 'x';
    }

    async function loadCurrentBlock() {
      stopAudio();

      const b = blocks[currentBlockIdx];
      document.getElementById('blockBadge').innerText = b.badge;
      document.getElementById('blockTitle').innerText = b.title;

      document.getElementById('prevBtn').disabled = (currentBlockIdx === 0);
      document.getElementById('prevBtnBottom').disabled = (currentBlockIdx === 0);
      document.getElementById('nextBtn').disabled = (currentBlockIdx === blocks.length - 1);
      document.getElementById('nextBtnBottom').disabled = (currentBlockIdx === blocks.length - 1);

      try {
        const response = await fetch(b.file);
        if (!response.ok) throw new Error("Файл не найден");
        const text = await response.text();
        currentPhrases = text.trim().split("\n").filter(l => l.includes("//")).map(line => {
          const parts = line.split("//");
          return { oldP: parts[0].trim(), newP: parts[1].trim() };
        });
        if (currentPhrases.length === 0) throw new Error("Пустой блок");
      } catch (e) {
        currentPhrases = fallbackBlock1;
      }

      renderPhrases();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderPhrases() {
      const container = document.getElementById('phraseList');
      container.innerHTML = "";

      currentPhrases.forEach((p, idx) => {
        const item = document.createElement('div');
        item.className = 'phrase-item';
        item.id = `phrase-item-${idx}`;
        item.innerHTML = `
          <div class="num-badge">#${idx + 1}</div>
          <div class="old-phrase">${escapeHtml(p.oldP)}</div>
          <div class="new-phrase">${escapeHtml(p.newP)}</div>
        `;
        container.appendChild(item);
      });

      document.getElementById('blockSummary').innerText = 
        `Всего выражений в блоке: ${currentPhrases.length}. Переключайтесь свободно между блоками.`;
    }

    function prevBlock() {
      if (currentBlockIdx > 0) {
        currentBlockIdx--;
        loadCurrentBlock();
      }
    }

    function nextBlock() {
      if (currentBlockIdx < blocks.length - 1) {
        currentBlockIdx++;
        loadCurrentBlock();
      }
    }

    function toggleAudio() {
      if (isSpeaking) {
        stopAudio();
      } else {
        startAudio();
      }
    }

    function startAudio() {
      if (!('speechSynthesis' in window)) {
        alert("Синтез речи не поддерживается в этом браузере.");
        return;
      }
      if (currentPhrases.length === 0) return;

      synth.cancel();
      isSpeaking = true;
      updateAudioBtn(true);
      speakPhraseAt(0);
    }

    function speakPhraseAt(index) {
      if (!isSpeaking || index >= currentPhrases.length) {
        stopAudio();
        return;
      }

      document.querySelectorAll('.phrase-item').forEach(el => el.classList.remove('active-speaking'));
      const activeEl = document.getElementById(`phrase-item-${index}`);
      if (activeEl) {
        activeEl.classList.add('active-speaking');
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      const phrase = currentPhrases[index];
      const utterance = new SpeechSynthesisUtterance(phrase.newP);
      utterance.lang = 'ru-RU';
      utterance.rate = currentSpeechRate;

      if (selectedVoice) {
        utterance.voice = selectedVoice;
      } else if (russianVoices.length > 0) {
        utterance.voice = russianVoices[0];
      }

      utterance.onend = () => {
        if (!isSpeaking) return;
        setTimeout(() => {
          if (isSpeaking) {
            speakPhraseAt(index + 1);
          }
        }, 1800);
      };

      utterance.onerror = () => {
        if (isSpeaking) speakPhraseAt(index + 1);
      };

      synth.speak(utterance);
    }

    function stopAudio() {
      if ('speechSynthesis' in window) {
        synth.cancel();
      }
      isSpeaking = false;
      updateAudioBtn(false);
      document.querySelectorAll('.phrase-item').forEach(el => el.classList.remove('active-speaking'));
    }

    function updateAudioBtn(speaking) {
      const btn = document.getElementById('audioToggleBtn');
      const icon = document.getElementById('audioIcon');
      const label = document.getElementById('audioLabel');

      if (speaking) {
        btn.classList.add('speaking');
        icon.innerText = "⏹️";
        label.innerText = "Остановить";
      } else {
        btn.classList.remove('speaking');
        icon.innerText = "🎧";
        label.innerText = "Озвучить блок";
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    if ('speechSynthesis' in window) {
      populateVoices();
      window.speechSynthesis.onvoiceschanged = () => {
        populateVoices();
      };
    }
    loadCurrentBlock();
  </script>
</body>
</html>
